name: Marketplace Theme Validate

# entries / themes / authors への PR を自動検証する。
#  1. JSON スキーマ + 必須フィールド
#  2. SHA-256 整合性 (entry.sha256 == sha256(themes/<id>.cursorpack))
#  3. Ed25519 署名検証
#  4. サイズ閾値 (50 MB)
#  5. マルウェアチェック: VIRUSTOTAL_API_KEY が設定されていれば VT API v3、
#     未設定時は scripts/marketplace/malware-hashes.txt にフォールバック

on:
  pull_request:
    paths:
      - 'entries/**'
      - 'themes/**'
      - 'authors/**'

jobs:
  validate:
    name: Validate marketplace submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed entries
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          {
            echo "list<<EOF"
            git diff --name-only "$BASE" "$HEAD" -- entries/ themes/ authors/
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Schema + SHA-256 + signature + malware validation
        run: node scripts/marketplace/validate.mjs
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.list }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
